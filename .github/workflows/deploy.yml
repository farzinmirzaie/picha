name: Deploy & Release

# Every push to master rebuilds the site, deploys it to GitHub Pages, and cuts
# a new versioned GitHub Release (auto-incrementing patch version).
on:
  push:
    branches: [master]
  workflow_dispatch:
  schedule:
    # Daily rebuild at noon MYT (04:00 UTC; MYT is UTC+8) so weigh-ins logged in
    # Supabase show up without a push. Releases are only cut for pushes (see the
    # release job). Note: GitHub may start scheduled runs a little late.
    - cron: '0 4 * * *'

permissions:
  contents: write # create tags + releases
  pages: write # deploy to Pages
  id-token: write # OIDC for deploy-pages

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Supabase secrets feed the build-time weight-ledger fetch
      # (src/data/weights.ts); without them the build uses the seed ledger.
      - run: pnpm build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          # VAPID public key (safe to expose) — lets the client subscribe to push.
          PUBLIC_VAPID_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}

      # Requires Pages to be enabled once: Settings → Pages → Source: "GitHub Actions".
      # (Auto-enablement via the default token isn't permitted on this repo.)
      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  release:
    needs: deploy
    # Scheduled/manual rebuilds redeploy content but don't cut releases.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Tag + create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest=$(git tag -l 'v*' --sort=-v:refname | head -n1)
          [ -z "$latest" ] && latest="v0.0.0"
          ver=${latest#v}
          IFS='.' read -r MAJOR MINOR PATCH <<< "$ver"
          next="v${MAJOR}.${MINOR}.$((PATCH + 1))"
          echo "Previous: $latest → New: $next"
          git tag "$next"
          git push origin "$next"
          gh release create "$next" \
            --title "$next" \
            --notes "Automated release from ${GITHUB_SHA::7} — deployed to GitHub Pages." \
            --target "$GITHUB_SHA"
